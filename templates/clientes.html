{% extends "base.html" %}

{% block title %}Clientes{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Gerenciar Clientes</h1>
    <button class="btn btn-primary" onclick="abrirModalCliente()">
        <i class="fas fa-plus"></i> Novo Cliente
    </button>
</div>

<div class="search-bar">
    <input type="text" id="searchCliente" placeholder="Buscar cliente..." class="form-control">
</div>

<div class="table-container">
    <table class="table">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Email</th>
                <th>Telefone</th>
                <th>CPF/CNPJ</th>
                <th>Cidade</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="clientesTable">
            <!-- Preenchido via JavaScript -->
        </tbody>
    </table>
</div>

<!-- Modal de Cliente -->
<div id="modalCliente" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">Novo Cliente</h2>
            <span class="close" onclick="fecharModal()">&times;</span>
        </div>
        <form id="clienteForm">
            <input type="hidden" id="clienteId">
            
            <div class="form-group">
                <label>Nome *</label>
                <input type="text" id="nome" class="form-control" required>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" class="form-control">
                </div>
                <div class="form-group">
                    <label>Telefone</label>
                    <input type="text" id="telefone" class="form-control">
                </div>
            </div>
            
            <div class="form-group">
                <label>CPF/CNPJ</label>
                <input type="text" id="cpf_cnpj" class="form-control">
            </div>
            
            <div class="form-group">
                <label>Endereço</label>
                <input type="text" id="endereco" class="form-control">
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Cidade</label>
                    <input type="text" id="cidade" class="form-control">
                </div>
                <div class="form-group">
                    <label>Estado</label>
                    <input type="text" id="estado" class="form-control" maxlength="2">
                </div>
                <div class="form-group">
                    <label>CEP</label>
                    <input type="text" id="cep" class="form-control">
                </div>
            </div>
            
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="fecharModal()">Cancelar</button>
                <button type="submit" class="btn btn-primary">Salvar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Funções para Clientes
    let clientes = [];
    
    async function carregarClientes() {
        const response = await fetch('/api/clientes');
        clientes = await response.json();
        renderizarTabelaClientes();
    }
    
    function renderizarTabelaClientes() {
        const tbody = document.getElementById('clientesTable');
        tbody.innerHTML = clientes.map(cliente => `
            <tr>
                <td>${cliente.nome}</td>
                <td>${cliente.email || '-'}</td>
                <td>${cliente.telefone || '-'}</td>
                <td>${cliente.cpf_cnpj || '-'}</td>
                <td>${cliente.cidade || '-'}</td>
                <td><span class="badge ${cliente.status === 'Ativo' ? 'badge-success' : 'badge-danger'}">${cliente.status}</span></td>
                <td class="actions">
                    <button class="btn-icon" onclick="editarCliente(${cliente.id})" title="Editar">
                        <i class="fas fa-edit"></i>
                    </button>
                    <button class="btn-icon" onclick="excluirCliente(${cliente.id})" title="Excluir">
                        <i class="fas fa-trash"></i>
                    </button>
                </td>
            </tr>
        `).join('');
    }
    
    function abrirModalCliente() {
        document.getElementById('modalTitle').textContent = 'Novo Cliente';
        document.getElementById('clienteForm').reset();
        document.getElementById('clienteId').value = '';
        document.getElementById('modalCliente').style.display = 'block';
    }
    
    async function editarCliente(id) {
        const response = await fetch(`/api/clientes/${id}`);
        const cliente = await response.json();
        
        document.getElementById('modalTitle').textContent = 'Editar Cliente';
        document.getElementById('clienteId').value = cliente.id;
        document.getElementById('nome').value = cliente.nome;
        document.getElementById('email').value = cliente.email || '';
        document.getElementById('telefone').value = cliente.telefone || '';
        document.getElementById('cpf_cnpj').value = cliente.cpf_cnpj || '';
        document.getElementById('endereco').value = cliente.endereco || '';
        document.getElementById('cidade').value = cliente.cidade || '';
        document.getElementById('estado').value = cliente.estado || '';
        document.getElementById('cep').value = cliente.cep || '';
        
        document.getElementById('modalCliente').style.display = 'block';
    }
    
    async function excluirCliente(id) {
        if (confirm('Tem certeza que deseja excluir este cliente?')) {
            await fetch(`/api/clientes/${id}`, { method: 'DELETE' });
            carregarClientes();
        }
    }
    
    function fecharModal() {
        document.getElementById('modalCliente').style.display = 'none';
    }
    
    document.getElementById('clienteForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const id = document.getElementById('clienteId').value;
        const clienteData = {
            nome: document.getElementById('nome').value,
            email: document.getElementById('email').value,
            telefone: document.getElementById('telefone').value,
            cpf_cnpj: document.getElementById('cpf_cnpj').value,
            endereco: document.getElementById('endereco').value,
            cidade: document.getElementById('cidade').value,
            estado: document.getElementById('estado').value,
            cep: document.getElementById('cep').value
        };
        
        const url = id ? `/api/clientes/${id}` : '/api/clientes';
        const method = id ? 'PUT' : 'POST';
        
        await fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(clienteData)
        });
        
        fecharModal();
        carregarClientes();
    });
    
    // Busca
    document.getElementById('searchCliente').addEventListener('input', (e) => {
        const termo = e.target.value.toLowerCase();
        const tbody = document.getElementById('clientesTable');
        const rows = tbody.getElementsByTagName('tr');
        
        for (let row of rows) {
            const text = row.textContent.toLowerCase();
            row.style.display = text.includes(termo) ? '' : 'none';
        }
    });
    
    // Fechar modal ao clicar fora
    window.onclick = function(event) {
        if (event.target == document.getElementById('modalCliente')) {
            fecharModal();
        }
    }
    
    // Carregar dados ao iniciar
    carregarClientes();
</script>
{% endblock %}
